# PROD PROFILE — production deployment
# All sensitive values must be supplied through environment variables.

server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}

  frontend-url: ${FRONTEND_URL}

  cors:
    allowed-origins: ${FRONTEND_URL}

  file:
    upload-dir: ${UPLOAD_DIR:uploads/}

logging:
  level:
    com.rentalhub: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN