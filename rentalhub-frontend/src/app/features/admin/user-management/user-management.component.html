<div class="page-container">
  <div class="page-header">
    <div class="page-header__titles">
      <h1>User Management</h1>
      <p>View and manage all RentalHub user accounts</p>
    </div>
  </div>

  <div class="rh-card">
    <div class="table-wrapper">
      <table mat-table [dataSource]="users" class="full-width-table">
        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let user">{{ user.id }}</td>
        </ng-container>

        <!-- Full Name -->
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let user">
            <div class="user-cell">
              <div class="user-avatar">{{ user.fullName.charAt(0) }}</div>
              <span>{{ user.fullName }}</span>
            </div>
          </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <!-- Roles -->
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip-set>
              <mat-chip
                *ngFor="let role of user.roles"
                [class]="'chip-' + getRoleColor(role)"
              >
                {{ getRoleLabel(role) }}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <!-- Active Status -->
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef>Active</th>
          <td mat-cell *matCellDef="let user">
            <mat-slide-toggle
              [checked]="user.isActive"
              (change)="toggleUserStatus(user, $event)"
              matTooltip="Toggle account active status"
            >
            </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Created Date -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Joined</th>
          <td mat-cell *matCellDef="let user">
            {{ user.createdAt | date: "mediumDate" }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div class="empty-state" *ngIf="!isLoading && users.length === 0">
        <mat-icon>people_outline</mat-icon>
        <p>No users found</p>
      </div>

      <div class="loading-state" *ngIf="isLoading">
        <p>Loading users...</p>
      </div>
    </div>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    >
    </mat-paginator>
  </div>
</div>
